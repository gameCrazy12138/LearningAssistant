name: Android APK Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK
      run: |
        # 设置环境变量
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # 添加到 PATH
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # 强制接受所有许可证
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # 安装必需组件
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"
        
        # 🔥 关键：使用 GITHUB_ENV 持久化环境变量到后续步骤
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        # 🔥 关键：使用 GITHUB_PATH 持久化 PATH 到后续步骤
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/31.0.0" >> $GITHUB_PATH
        
        # 验证安装
        echo "=== Installed build-tools ==="
        ls -la $ANDROID_HOME/build-tools/
        echo "=== Aidl location ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/aidl 2>/dev/null || echo "aidl not found!"
        echo "=== NDK location ==="
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not found!"
    
    - name: Install dependencies
      run: |
        pip install buildozer cython==3.0.0
    
    - name: Build APK
      run: |
        # 🔥 环境变量已通过 GITHUB_ENV 自动设置
        # 验证环境变量
        echo "=== Environment Variables ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        
        # 🔥 关键修复：创建符号链接，让 Buildozer 能找到 SDK
        # Buildozer 默认在 ~/.buildozer/android/platform/android-sdk/ 查找 SDK
        # 我们创建符号链接指向实际安装的 SDK 位置
        mkdir -p /home/runner/.buildozer/android/platform
        ln -sf /home/runner/android-sdk /home/runner/.buildozer/android/platform/android-sdk
        
        # 🔥 关键修复 2：创建完整的 tools/bin 目录结构
        # Buildozer 期望在 tools/bin/sdkmanager 找到 sdkmanager
        # 但现代 SDK 使用 cmdline-tools/latest，需要创建兼容链接
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        ln -sf /home/runner/android-sdk/cmdline-tools/latest/bin /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # 验证符号链接
        echo "=== Symlink verification ==="
        echo "SDK symlink:"
        ls -la /home/runner/.buildozer/android/platform/ || true
        echo "Tools symlink:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/ || true
        echo "bin symlink:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin/ || true
        echo "sdkmanager verification:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>/dev/null && echo "✓ sdkmanager found!" || echo "✗ sdkmanager NOT found!"
        
        # 验证 build-tools 存在
        echo "=== Checking build-tools ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/ || echo "build-tools not found!"
        
        cd android_build
        # 显式设置 Buildozer 使用的 SDK 路径
        export BUILDOZER_SPEC_ANDROID_SDK_PATH=$ANDROID_HOME
        export BUILDOZER_SPEC_ANDROID_NDK_PATH=$ANDROID_HOME/ndk/25.2.9519653
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android_build/bin/*.apk
