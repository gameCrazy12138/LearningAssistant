name: Android APK Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK
      run: |
        # 使用一致的环境变量路径
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # 添加到 PATH
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # 强制接受所有许可证
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # 安装必需组件
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"
        
        # 验证安装
        echo "=== Installed build-tools ==="
        ls -la $ANDROID_HOME/build-tools/
        echo "=== Aidl location ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/aidl 2>/dev/null || echo "aidl not found!"
    
    - name: Install dependencies
      run: |
        pip install buildozer cython==3.0.0
    
    - name: Build APK
      run: |
        # 使用与安装时相同的环境变量
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/31.0.0
        
        # 验证 build-tools 存在
        echo "=== Checking build-tools ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/ || echo "build-tools not found!"
        
        cd android_build
        buildozer android debug
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android_build/bin/*.apk
