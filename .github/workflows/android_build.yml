name: Android APK Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK
      run: |
        # 设置环境变量
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # 添加到 PATH
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # 强制接受所有许可证
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # 安装必需组件
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"
        
        # 关键：使用 GITHUB_ENV 持久化环境变量到后续步骤
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        # 关键：使用 GITHUB_PATH 持久化 PATH 到后续步骤
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/31.0.0" >> $GITHUB_PATH
        
        # 验证安装
        echo "=== Installed build-tools ==="
        ls -la $ANDROID_HOME/build-tools/
        echo "=== Aidl location ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/aidl 2>/dev/null || echo "aidl not found!"
        echo "=== NDK location ==="
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not found!"
    
    - name: Install dependencies
      run: |
        # 安装 Buildozer 和 Cython
        pip install buildozer cython==3.0.0
        
        # 🔥 关键修复：安装 python-for-android 所需的编译依赖
        sudo apt-get update
        sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libfreetype6-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool
    
    - name: Build APK
      run: |
        # 环境变量已通过 GITHUB_ENV 自动设置
        # 验证环境变量
        echo "=== Environment Variables ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        
        # 关键修复：直接复制整个 SDK 到 Buildozer 期望的位置，避免符号链接冲突
        # Buildozer 默认在 ~/.buildozer/android/platform/android-sdk/ 查找 SDK
        
        # 删除任何现存的符号链接或目录，确保清洁状态
        rm -rf /home/runner/.buildozer/android/platform/android-sdk
        
        # 直接复制整个 SDK，不使用符号链接
        mkdir -p /home/runner/.buildozer/android/platform
        cp -r /home/runner/android-sdk /home/runner/.buildozer/android/platform/
        
        # 🔥 关键修复：Buildozer 期望在 tools/bin/sdkmanager 找到 sdkmanager
        # 但现代 SDK 使用 cmdline-tools/latest，需要创建符号链接
        # 注意：sdkmanager 需要 lib/和 lib64/目录中的依赖库
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools
        
        # 创建 bin 目录符号链接
        ln -sf /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin \
               /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # 创建 lib 目录符号链接（sdkmanager 依赖）
        ln -sf /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/lib \
               /home/runner/.buildozer/android/platform/android-sdk/tools/lib
        
        # 🔥 关键修复：检查 lib64 是否存在，不存在则创建空目录
        if [ -d /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/lib64 ]; then
            ln -sf /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/lib64 \
                   /home/runner/.buildozer/android/platform/android-sdk/tools/lib64
            echo "lib64 symlink created"
        else
            mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/lib64
            echo "lib64 directory created (original not found)"
        fi
        
        # 🔥 关键修复 2：确保 sdkmanager 可执行并设置 JAVA_HOME
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 🔥 检查原始 lib64 目录是否存在
        echo "=== Checking original lib64 ==="
        ls -la /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ | grep lib64 || echo "lib64 not found in cmdline-tools/latest"
        
        # 验证 sdkmanager 可执行
        echo "=== Testing sdkmanager ==="
        chmod +x /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 检查符号链接实际指向
        echo "Symlink target:"
        readlink -f /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || echo "readlink failed"
        
        # 检查文件是否存在
        echo "File check:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || echo "sdkmanager not found"
        
        # 尝试执行并捕获详细错误
        echo "=== Running sdkmanager --version ==="
        /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version 2>&1 || {
            echo "sdkmanager failed, checking Java..."
            java -version 2>&1
            echo "Trying with explicit Java..."
            java -jar /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager.jar --version 2>&1 || echo "jar method also failed"
        }
        
        # 验证
        echo "=== SDK verification ==="
        echo "cmdline-tools:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/ || true
        echo "tools directory:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/ || true
        echo "bin symlink:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin/ || true
        echo "lib symlink:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/lib/ || true
        echo "lib64 symlink:"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/lib64/ || true
        echo "sdkmanager verification:"
        test -f /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager && echo "✓ sdkmanager found!" || echo "✗ sdkmanager NOT found!"
        test -x /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager && echo "✓ sdkmanager is executable!" || echo "✗ sdkmanager NOT executable!"
        
        # 验证 build-tools 存在
        echo "=== Checking build-tools ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/ || echo "build-tools not found!"
        
        cd android_build
        # 🔥 关键修复：让 Buildozer 直接使用复制后的 SDK 和 NDK
        export ANDROIDSDKPATH=/home/runner/.buildozer/android/platform/android-sdk
        export ANDROIDNDKPATH=/home/runner/.buildozer/android/platform/android-sdk/ndk/25.2.9519653
        
        # 显式设置 Buildozer 配置中的路径
        export BUILDOZER_SPEC_ANDROID_SDK_PATH=$ANDROIDSDKPATH
        export BUILDOZER_SPEC_ANDROID_NDK_PATH=$ANDROIDNDKPATH
        
        # 确保 PATH 优先使用复制的 SDK
        export PATH=$ANDROIDSDKPATH/cmdline-tools/latest/bin:$ANDROIDSDKPATH/platform-tools:$ANDROIDSDKPATH/build-tools/31.0.0:$PATH
        
        # 🔥 设置 Buildozer 日志级别为 DEBUG 以查看详细错误
        export BUILDOZER_LOGLEVEL=2
        
        # 🔥 验证 NDK 路径存在
        echo "=== Verifying NDK path ==="
        ls -la $ANDROIDNDKPATH || echo "NDK not found at $ANDROIDNDKPATH"
        test -d $ANDROIDNDKPATH && echo "✓ NDK directory exists!" || echo "✗ NDK directory NOT exists!"
        
        # 🔥 验证 SDK 路径存在
        echo "=== Verifying SDK path ==="
        ls -la $ANDROIDSDKPATH || echo "SDK not found at $ANDROIDSDKPATH"
        test -d $ANDROIDSDKPATH && echo "✓ SDK directory exists!" || echo "✗ SDK directory NOT exists!"
        
        # 🔥 清理 Buildozer 缓存，强制使用新路径
        rm -rf /home/runner/.buildozer/android/platform/android-ndk-r25b
        
        # 🔥 关键修复：直接修改 buildozer.spec 文件中的 NDK 路径
        # Buildozer 会优先读取配置文件而不是环境变量
        sed -i "s|# android.ndk_path = .*|android.ndk_path = $ANDROIDNDKPATH|" buildozer.spec
        sed -i "s|# android.sdk_path = .*|android.sdk_path = $ANDROIDSDKPATH|" buildozer.spec
        
        # 验证修改
        echo "=== Updated buildozer.spec ==="
        grep "android.ndk_path\|android.sdk_path" buildozer.spec
        
        # 运行 Buildozer
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android_build/bin/*.apk
