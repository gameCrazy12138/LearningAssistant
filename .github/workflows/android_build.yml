name: Android APK Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # 设置环境变量
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # 自动接受所有许可证
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # 安装必需组件
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"
        
        # 验证安装
        ls -la $ANDROID_HOME/build-tools/
    
    - name: Install dependencies
      run: |
        pip install buildozer cython==3.0.0
    
    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/31.0.0
        cd android_build
        buildozer android debug
      env:
        ANDROID_HOME: ${{ runner.workspace }}/android-sdk
        ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android_build/bin/*.apk
