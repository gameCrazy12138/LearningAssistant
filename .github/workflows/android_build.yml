name: Android APK Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/31.0.0" >> $GITHUB_PATH
        
        echo "=== Installed build-tools ==="
        ls -la $ANDROID_HOME/build-tools/
        echo "=== Aidl location ==="
        ls -la $ANDROID_HOME/build-tools/31.0.0/aidl 2>/dev/null || echo "aidl not found!"
        echo "=== NDK location ==="
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not found!"
    
    - name: Install dependencies
      run: |
        pip install buildozer cython==3.0.0
        sudo apt-get update
        sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev libtiff-dev libfreetype6-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            openjdk-17-jdk autoconf automake libtool libtool-bin autoconf-archive \
            pkg-config cmake ninja-build
    
    - name: Build APK
      run: |
        # 清除可能冲突的预置 NDK 环境变量
        unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
        
        # 设置 JAVA_HOME
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # 复制 SDK 到 Buildozer 期望的位置
        rm -rf /home/runner/.buildozer/android/platform/android-sdk
        mkdir -p /home/runner/.buildozer/android/platform
        cp -r /home/runner/android-sdk /home/runner/.buildozer/android/platform/
        
        ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
        
        # 修复 sdkmanager 路径：直接复制 cmdline-tools/latest 为 tools
        rm -rf $ANDROID_SDK_ROOT/tools
        cp -r $ANDROID_SDK_ROOT/cmdline-tools/latest $ANDROID_SDK_ROOT/tools
        
        # 创建 NDK 兼容符号链接
        ln -sf $ANDROID_SDK_ROOT/ndk/25.2.9519653 $ANDROID_SDK_ROOT/android-ndk-r25b
        
        # 设置正确的 NDK 环境变量
        export ANDROIDNDKPATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653
        export ANDROID_NDK=$ANDROIDNDKPATH
        export ANDROID_NDK_HOME=$ANDROIDNDKPATH
        export ANDROID_NDK_ROOT=$ANDROIDNDKPATH
        
        # 设置 aclocal 宏路径
        export ACLOCAL_PATH="/usr/share/aclocal:/usr/local/share/aclocal"
        
        # 🔥 关键修复：在 Buildozer 运行前先创建目录并复制宏文件
        # 先让 Buildozer 下载 libffi 源码
        cd android_build
        
        # 创建临时目录并预下载 libffi
        mkdir -p /tmp/libffi_m4
        cp /usr/share/aclocal/libtool.m4 /tmp/libffi_m4/ 2>/dev/null || true
        cp /usr/share/aclocal/ltoptions.m4 /tmp/libffi_m4/ 2>/dev/null || true
        cp /usr/share/aclocal/ltsugar.m4 /tmp/libffi_m4/ 2>/dev/null || true
        cp /usr/share/aclocal/ltversion.m4 /tmp/libffi_m4/ 2>/dev/null || true
        cp /usr/share/aclocal/lt~obsolete.m4 /tmp/libffi_m4/ 2>/dev/null || true
        
        # 🔥 创建一个包装脚本在 autogen.sh 执行前替换宏文件
        cat > /tmp/patch_libffi.sh << 'PATCH_EOF'
#!/bin/bash
# 等待 libffi 目录创建后复制宏文件
LIBFFI_BASE="/home/runner/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libffi"

# 轮询等待 libffi 目录创建
for i in {1..30}; do
    if [ -d "$LIBFFI_BASE" ]; then
        # 找到所有 m4 目录并复制宏文件
        find "$LIBFFI_BASE" -type d -name "m4" 2>/dev/null | while read M4_DIR; do
            cp /tmp/libffi_m4/*.m4 "$M4_DIR/" 2>/dev/null || true
            echo "Patched: $M4_DIR"
        done
        echo "Libffi macros patched successfully!"
        exit 0
    fi
    sleep 1
done

echo "Warning: libffi directory not found, patching failed"
exit 1
PATCH_EOF
        
        chmod +x /tmp/patch_libffi.sh
        
        # 在后台运行补丁脚本
        /tmp/patch_libffi.sh &
        PATCH_PID=$!
        
        # 等待补丁完成
        sleep 2
        
        # 修改 buildozer.spec 中的路径
        sed -i "s|# android.sdk_path = .*|android.sdk_path = $ANDROID_SDK_ROOT|" buildozer.spec
        sed -i "s|# android.ndk_path = .*|android.ndk_path = $ANDROIDNDKPATH|" buildozer.spec
        sed -i "s|# android.ndk = .*|android.ndk = 25.2.9519653|" buildozer.spec
        
        # 添加 SDK 工具到 PATH
        export PATH=$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/31.0.0:$PATH
        
        # 可选：开启详细日志
        export BUILDOZER_LOGLEVEL=2
        
        # 🔥 等待补丁脚本完成
        echo "Waiting for libffi patch to complete..."
        wait $PATCH_PID
        PATCH_STATUS=$?
        if [ $PATCH_STATUS -eq 0 ]; then
            echo "✓ Libffi patched successfully!"
        else
            echo "✗ Libffi patch failed with status $PATCH_STATUS"
        fi
        
        # 运行 Buildozer
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android_build/bin/*.apk
